# A first policy for Building58 (Exhibit's docs/spec.md section 8.1). Copy it to evidence.yml at
# the top of Building58. It is a start: phase A of the field test (spec 12) finds the escaped
# defects, and the kinds and their needs come from them later. A change to this file always needs
# a person (spec 9.8).
version: 3

settings:
  # All of relay/test/*.test.js as JUnit, six files at a time, as relay/test/run.js runs them.
  # run.js writes no JUnit, so this does what it does with node --test: each file gets a new empty
  # HOME of its own, so no test reads a room's files under ~/.office-world or another file's, and
  # writes its own JUnit file. Then the files are joined into one. --ignore-scripts skips
  # "prepare", which only sets git hooks. The browser tests in relay/test/browser/ are not in it.
  #
  # Each file also has a time limit, 600 seconds as in run.js. TEST_FILE_SECONDS sets another one,
  # read as run.js reads it, so a value that is not a number, or 0, gives 600. A file can leave a
  # timer, a relay or a child process running after its last test, and then it never ends.
  # RUN_FILE is a short node script that runs one file. Past the limit, it stops the file and every
  # process still under it, and writes a JUnit file with one failing test case that names the
  # file, so the joined file still names it. The other files go on. A process whose parent ended
  # is no longer under the file, so it runs on until Exhibit stops the whole command. macOS has no
  # timeout command, so the script is in node, which every run already has.
  test_command: |-
    npm ci --ignore-scripts --no-audit --no-fund &&
    mkdir -p .exhibit/junit &&
    export RUN_FILE='
    const { spawn, execFileSync } = require("node:child_process");
    const { writeFileSync } = require("node:fs");
    const { resolve } = require("node:path");
    const file = process.argv[1];
    const limit = Math.max(1, Number(process.env.TEST_FILE_SECONDS) || 600);
    const out = `.exhibit/junit/${file.split("/").pop()}.xml`;
    const child = spawn(process.execPath, ["--test", "--test-timeout=120000", "--test-reporter=junit", `--test-reporter-destination=${out}`, file], { stdio: "ignore" });
    const timer = setTimeout(() => {
      const rows = execFileSync("ps", ["-A", "-o", "pid=", "-o", "ppid="], { encoding: "utf8" }).trim().split("\n").map((row) => row.trim().split(/\s+/).map(Number));
      const tree = [child.pid];
      for (let i = 0; i < tree.length; i++) for (const [pid, ppid] of rows) if (ppid === tree[i]) tree.push(pid);
      for (const pid of tree) try { process.kill(pid, "SIGKILL"); } catch { /* already gone */ }
      const name = `${file} ran past its time limit of ${limit} seconds`;
      const xml = (text) => text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
      writeFileSync(out, `<?xml version="1.0" encoding="utf-8"?>\n<testsuites>\n<testcase name="${xml(name)}" classname="test" file="${xml(resolve(file))}"><failure message="${xml(name)}"/></testcase>\n</testsuites>\n`);
      console.error(`${name}, so it was stopped and counts as failed`);
      process.exit(1);
    }, limit * 1000);
    child.on("exit", (code) => { clearTimeout(timer); process.exit(code ?? 1); });
    ' &&
    { ls relay/test/*.test.js | xargs -P 6 -n 1 sh -c 'HOME="$(mktemp -d)" node -e "$RUN_FILE" "$1"' sh; code=$?;
    { echo '<?xml version="1.0" encoding="utf-8"?>'; echo '<testsuites>'; sed -e '/^<?xml/d' -e '/^<\/*testsuites>$/d' .exhibit/junit/*.xml; echo '</testsuites>'; } > .exhibit/junit.xml;
    exit $code; }
  test_results: .exhibit/junit.xml
  # Titles start with a ticket key, such as "T-401: ...", so title_after_key skips it (spec 9.1).
  fix_signals: [label:bug, title_after_key:fix, branch:fix/]

kinds:
  # The code that runs: the relay, the office page, and what they share, with the packages, the
  # git hooks and CI.
  code:
    match: ["relay/**", "office/**", "shared/**", "index.html", "package.json", "package-lock.json", ".githooks/**", ".github/**", "eslint.config.js", "eslint-local.js", "eslint-suppressions.json"]
    risk: medium
    needs:
      - tests-before-after
      - failing-before: { when: [fix] }

  # The manual and the other Markdown files. The probe is the manual's checks that CI runs for a
  # docs-only change: links, anchors and no em dashes.
  docs:
    match: ["docs/**", "**/*.md"]
    risk: low
    needs:
      - probe: { name: manual, run: "npm ci --ignore-scripts --no-audit --no-fund && node relay/test/run.js relay/test/manual.test.js" }

# Any other file.
default:
  risk: medium
  needs:
    - tests-before-after
