# Exhibit on every pull request in edd-platform, in shadow mode (Exhibit's docs/spec.md section 12).
# Copy this file to .github/workflows/exhibit.yml in edd-platform. examples/edd-platform/README.md
# in the Exhibit repo says why each part is here.
#
# This is Exhibit's examples/pull-request.yml with three changes:
# - The check job sets up uv and Node 22, as edd-platform's CI does, because evidence.yml runs the
#   API tests with uv, and the web probe builds the web app with Node.
# - Each job has a time limit.
# - Both jobs pin the release v0.1.0. Keep the same release in both jobs. Never use v0 or main: they
#   move, so the check job and the publish job of one run could get different Exhibit code.
name: Exhibit

# Never pull_request_target: that runs with a write token and the repo's secrets, on a run that can
# be made to execute code from the PR.
on:
  pull_request:

# No job gets a permission that it does not name below.
permissions: {}

jobs:
  check:
    name: Exhibit check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      # Read the code and the PR. The check runs the PR's code, so it gets nothing more.
      # edd-platform is a public repo, so this reads the PR too.
      contents: read
    steps:
      # The whole history, so the PR's base and head commits are both in the clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # uv runs the API tests. Node 22 builds the web app, and runs Exhibit, which needs Node 20
      # or later.
      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # GitHub gives a PR from a fork a token that cannot write, so the publish job is skipped.
      - name: Say why the publish job is skipped
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          {
            echo '> [!NOTE]'
            echo '> This PR comes from a fork. GitHub gives it a token that cannot write, so the publish job is skipped: the exhibit is not stored on the data branch, and no comment is posted. The exhibit is in the workflow artifact named exhibit.'
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      # enforce: false is shadow mode. The step succeeds whatever the verdict, and the job summary
      # shows the verdict. Phase C of the field test sets it to true, in both jobs.
      - uses: bfalkowski/exhibit@v0.1.0
        with:
          command: check
          enforce: false

  publish:
    name: Exhibit publish
    needs: check
    # After the check, even when the check step failed, so the comment shows why. Never for a PR
    # from a fork.
    if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
    # One publish at a time for each PR. Publish posts the comment when it finds none of its own, so
    # two at the same time could post two comments. A second run waits. If a third comes while it
    # waits, GitHub cancels the waiting one, and the newest run posts.
    concurrency:
      group: exhibit-publish-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # Push the exhibit to the exhibit-data branch.
      contents: write
      # Post the summary comment on the PR, or update it.
      pull-requests: write
    steps:
      # The base commit, never the PR's head.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - uses: actions/download-artifact@v4
        with:
          name: exhibit
          path: .exhibit

      # The same release of Exhibit as the check job, and the same enforce.
      - uses: bfalkowski/exhibit@v0.1.0
        with:
          command: publish
          comment: true
          enforce: false
