name: CI

# Pull requests, and every push to main. Two PRs can each pass against an old main and still clash
# once both merge. The push run on main shows that within minutes. Never pull_request_target: that
# runs with the base repo's secrets on code from the pull request.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its run that is still going, which tested an old commit.
# A push to main has no pull request number, so each push run gets its own group, keyed by its run
# id. Nothing cancels it, and it never waits behind another run, so every merge gets a result.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-push-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every line of every tracked file, not just what the pull request adds, so a secret already on
  # main is found too. It needs only a checkout and the runner's own Node, no npm ci.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node scripts/check-secrets.js --all

  test:
    name: Lint and test (Node 20)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
